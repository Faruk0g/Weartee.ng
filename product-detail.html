<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearTee.ng | Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <!-- TICKER -->
    <div class="ticker-wrap">
        <div class="ticker-track">
            <span>DELIVERY ACROSS NIGERIA</span><span class="ticker-sep">◆</span>
            <span>BANK TRANSFER ACCEPTED</span><span class="ticker-sep">◆</span>
            <span>ORDER VIA WHATSAPP FOR INSTANT SUPPORT</span><span class="ticker-sep">◆</span>
            <span>PREMIUM NIGERIAN STREETWEAR</span><span class="ticker-sep">◆</span>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">Wear<span>Tee</span>.ng</a>
            <div class="search-wrap">
                <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search tees, caps, joggers..." autocomplete="off">
            </div>
            <div class="header-actions">
                <a href="cart.html" class="cart-btn" id="cart-open">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    Cart <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- PRODUCT DETAIL CONTENT -->
    <div class="pd-page">
        <a href="index.html" class="pd-back-link">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Back to Shop
        </a>
        <div id="pd-page-content"><!-- populated by products.js on load --></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="products.js"></script>
</body>
</html>
